name: Euclidean Rellich CI

on:
  push:
    branches: ['compat/euclidean-lean-v4.34.1']
  pull_request:
    branches: ['compat/euclidean-lean-v4.34.1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      MATHLIB_NO_CACHE_ON_UPDATE: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch the pinned Mathlib dependencies of the Euclidean proof and example
        run: python3 scripts/fetch-euclidean-cache.py
      - name: Build the Euclidean root with warnings as errors
        run: lake --wfail build
      - name: Build the downstream example with warnings as errors
        run: lake --wfail build RellichKondrachovExamples
      - name: Lint the supported import closure and check its transitive axioms
        run: lake env lean -DwarningAsError=true scripts/CheckEuclidean.lean
